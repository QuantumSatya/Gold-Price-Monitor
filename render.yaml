services:
  - type: web
    name: gold-telegram-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py

  - type: cron
    name: gold-telegram-check
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python gold_monitor.py
