services:
  - type: web
    name: gold-manual-reference
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: DB_PATH
        value: /var/data/gold.db
    disk:
      name: gold-data
      mountPath: /var/data
      sizeGB: 1
  - type: cron
    name: gold-manual-reference-check
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python gold_monitor.py
    envVars:
      - key: DB_PATH
        value: /var/data/gold.db
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: satyajeetpatil1992@gmail.com
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: ALERT_EMAIL_TO
        value: satyajeetpatil1992@gmail.com
    disk:
      name: gold-data
      mountPath: /var/data
      sizeGB: 1
